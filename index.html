<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantBook - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <button class="icon-btn"><ion-icon name="menu-outline"></ion-icon></button>
        <h1 class="logo">QuantBook</h1>
        <div class="profile-pic">EL</div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
        
        <!-- Account Balance Card -->
        <section class="card balance-card">
            <h2 class="card-title">Solde Total</h2>
            <div class="balance-amount" id="account-balance">$0.00</div>
            <div class="balance-trend" id="trend-container">
                <ion-icon name="arrow-up-outline" id="trend-icon"></ion-icon>
                <span id="bot-perf">0.00%</span> <span class="trend-label">ce mois-ci</span>
            </div>
            
            <div class="divider"></div>
            
            <div class="buying-power-row">
                <span class="bp-label">Pouvoir d'achat disponible</span>
                <span class="bp-value" id="buying-power">$0.00</span>
            </div>
        </section>

        <!-- Benchmark Comparison Chart -->
        <section class="card chart-card">
            <div class="card-header-row">
                <h2 class="card-title">Performance vs S&P 500</h2>
                <button class="more-btn"><ion-icon name="ellipsis-vertical"></ion-icon></button>
            </div>
            <div class="chart-container">
                <canvas id="perfChart"></canvas>
            </div>
        </section>

        <!-- Top Picks List -->
        <section class="card picks-card">
            <div class="card-header-row">
                <h2 class="card-title">Top Achats IA</h2>
                <span class="badge" id="picks-count">3</span>
            </div>
            
            <div class="list-container" id="top-picks-list">
                <div class="loading-text">Chargement des données...</div>
            </div>
        </section>

        <!-- Recent Transactions -->
        <section class="card history-card" style="margin-bottom: 90px;">
            <div class="card-header-row">
                <h2 class="card-title">Historique des Ordres</h2>
                <button class="more-btn"><ion-icon name="filter-outline"></ion-icon></button>
            </div>
            
            <div class="list-container" id="history-list">
                <div class="loading-text">Chargement des données...</div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <ion-icon name="home"></ion-icon>
            <span>Accueil</span>
        </a>
        <a href="#" class="nav-item">
            <ion-icon name="pie-chart-outline"></ion-icon>
            <span>Actifs</span>
        </a>
        <a href="#" class="nav-item">
            <ion-icon name="swap-horizontal-outline"></ion-icon>
            <span>Ordres</span>
        </a>
        <a href="#" class="nav-item">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Réglages</span>
        </a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
