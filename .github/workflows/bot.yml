name: Robot Trading Quotidien (V7 Pro Alpaca)

on:
  schedule:
    # Exécution du mardi au samedi à 01h45 UTC 
    # (Correspond à 21h45 Heure de l'Est la veille au soir en été)
    - cron: '45 1 * * 2-6'
  workflow_dispatch: # Permet de le lancer manuellement via un bouton sur GitHub

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Accélère l'installation

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le Robot (live_bot.py)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_bot.py

      - name: Sauvegarder les predictions
        run: |
          git config --global user.name "V7 PRO Bot"
          git config --global user.email "bot@v7pro.com"
          git add dashboard_data.json
          git commit -m "🤖 Mise à jour automatique des prédictions" || echo "Pas de changement"
          git push
